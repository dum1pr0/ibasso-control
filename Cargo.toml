[package]
name = "ibasso-control"
version = "0.4.0"
edition = "2021"
description = "Desktop control for iBasso USB DAC/amps on Windows and Linux"
license = "MIT"
repository = "https://github.com/dum1pr0/ibasso-control"

[lib]
name = "ibasso_control"
path = "src/lib.rs"

[[bin]]
name = "ibasso-control"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
hidapi = "2.6"

[build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
# StatusNotifierItem tray used directly, because it reports mouse wheel turns over the icon.
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
tempfile = "3"
# Only to choose the X11 backend: Wayland does not let an app hide its window and show it again.
winit = { version = "0.30", default-features = false, features = ["x11"] }

[target."cfg(windows)".dependencies]
tray-icon = { version = "0.26.1", default-features = false }
raw-window-handle = "0.6"
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Foundation", "Win32_Storage_EnhancedStorage"] }
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_LibraryLoader"] }

[profile.release]
opt-level = 3
lto = "thin"

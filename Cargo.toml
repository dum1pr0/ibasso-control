[package]
name = "ibasso-control"
version = "0.2.0"
edition = "2021"
description = "Desktop control for iBasso USB DAC/amps on Windows and Linux"
license = "MIT"

[lib]
name = "ibasso_control"
path = "src/lib.rs"

[[bin]]
name = "ibasso-control"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
hidapi = "2.6"

[build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"

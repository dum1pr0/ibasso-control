name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            # Static C runtime: the .exe runs without the Visual C++ Redistributable.
            rustflags: -C target-feature=+crt-static
            asset: ibasso-control-windows-x64.exe
          - name: Linux x64
            # The oldest supported runner, so the binary runs on older glibc versions too.
            os: ubuntu-22.04
            rustflags: ""
            asset: ibasso-control-linux-x64.tar.gz
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libudev-dev libxkbcommon-dev \
            libgl1-mesa-dev libwayland-dev libx11-dev

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir dist
          cp target/release/ibasso-control.exe "dist/${{ matrix.asset }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/ibasso-control
          cp target/release/ibasso-control assets/icon.png README.md LICENSE dist/ibasso-control/
          tar -C dist -czf "dist/${{ matrix.asset }}" ibasso-control

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
